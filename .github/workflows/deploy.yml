name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # NEXT_PUBLIC_* env vars must be present during `next build`
      # because they get inlined into the client bundle. They live in
      # GitHub repo *variables* (vars.*), not secrets.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Confirm auth
        run: |
          echo "Account ID length: ${#CLOUDFLARE_ACCOUNT_ID}"
          npx wrangler whoami

      - name: Build with OpenNext
        run: npm run cf:build

      - name: Deploy Worker
        run: npx opennextjs-cloudflare deploy

      - name: Sync Worker runtime secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          # DATABASE_URL is required; the others are env-guarded and
          # only synced when a value is set in the GitHub repo secrets.
          printf '%s' "$DATABASE_URL" | npx wrangler secret put DATABASE_URL
          if [ -n "$RESEND_API_KEY" ]; then
            printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
          else
            echo "RESEND_API_KEY not set — skipping (email notifications disabled)."
          fi
          if [ -n "$TURNSTILE_SECRET_KEY" ]; then
            printf '%s' "$TURNSTILE_SECRET_KEY" | npx wrangler secret put TURNSTILE_SECRET_KEY
          else
            echo "TURNSTILE_SECRET_KEY not set — skipping (spam protection disabled)."
          fi
